name: murm-services

x-builtin-build: &builtin-build
  context: ../..
  dockerfile: services/builtin/Dockerfile

x-builtin-environment: &builtin-environment
  MURM_SERVICE_ISOLATED: "true"
  MURM_SERVICE_HOST: 0.0.0.0
  MURM_SERVICE_PORT: 8787

services:
  task:
    build: *builtin-build
    environment:
      <<: *builtin-environment
      MURM_SERVICE_ID: task
      MURM_SERVICE_PRINCIPALS: ${MURM_TASK_SERVICE_PRINCIPALS:-[]}
      MURM_SERVICE_PUBLIC_URL: http://task:8787
      MURM_SERVICE_DATABASE: /var/lib/murm/task.sqlite
    ports:
      - "${MURM_TASK_PORT:-8781}:8787"
    volumes:
      - task-data:/var/lib/murm

  context:
    build: *builtin-build
    environment:
      <<: *builtin-environment
      MURM_SERVICE_ID: context
      MURM_SERVICE_PRINCIPALS: ${MURM_CONTEXT_SERVICE_PRINCIPALS:-[]}
      MURM_SERVICE_PUBLIC_URL: http://context:8787
      MURM_SERVICE_DATABASE: /var/lib/murm/context.sqlite
    ports:
      - "${MURM_CONTEXT_PORT:-8782}:8787"
    volumes:
      - context-data:/var/lib/murm

  judge:
    build: *builtin-build
    environment:
      <<: *builtin-environment
      MURM_SERVICE_ID: judge
      MURM_SERVICE_PRINCIPALS: ${MURM_JUDGE_SERVICE_PRINCIPALS:-[]}
      MURM_SERVICE_PUBLIC_URL: http://judge:8787
      MURM_SERVICE_DATABASE: /var/lib/murm/judge.sqlite
      # Configure a mounted, pinned checker project before enabling candidate
      # checks; the service remains healthy and reports unavailable until the
      # fixture binding is provided.
      MURM_JUDGE_FIXTURE_MANIFEST: ${MURM_JUDGE_FIXTURE_MANIFEST:-}
      MURM_JUDGE_PREBUILD: ${MURM_JUDGE_PREBUILD:-false}
      MURM_JUDGE_PROJECT_ROOT: ${MURM_JUDGE_PROJECT_ROOT:-/checker}
      MURM_JUDGE_PREBUILD_KEY: ${MURM_JUDGE_PREBUILD_KEY:-}
    ports:
      - "${MURM_JUDGE_PORT:-8783}:8787"
    volumes:
      - judge-data:/var/lib/murm

  catalog:
    build: *builtin-build
    environment:
      <<: *builtin-environment
      MURM_SERVICE_ID: catalog
      MURM_SERVICE_PRINCIPALS: ${MURM_CATALOG_SERVICE_PRINCIPALS:-[]}
      MURM_SERVICE_PUBLIC_URL: http://catalog:8787
      MURM_TASK_SERVICE_URL: http://task:8787
      MURM_TASK_SERVICE_TOKEN: ${MURM_TASK_SERVICE_TOKEN:-}
      MURM_CONTEXT_SERVICE_URL: http://context:8787
      MURM_CONTEXT_SERVICE_TOKEN: ${MURM_CONTEXT_SERVICE_TOKEN:-}
      MURM_JUDGE_SERVICE_URL: http://judge:8787
      MURM_JUDGE_SERVICE_TOKEN: ${MURM_JUDGE_SERVICE_TOKEN:-}
    ports:
      - "${MURM_CATALOG_PORT:-8784}:8787"

volumes:
  task-data:
  context-data:
  judge-data:
