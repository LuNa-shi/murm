name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish @luna-shi/murm to npm'
        type: boolean
        default: false
      publish_worker_image:
        description: 'Build and push ghcr.io/luna-shi/murm-worker to GHCR'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify package version matches tag
        id: version
        env:
          PUBLISH_NPM: ${{ github.event_name == 'push' || inputs.publish_npm }}
          PUBLISH_WORKER: ${{ github.event_name == 'push' || inputs.publish_worker_image }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
          if { [ "$PUBLISH_NPM" = "true" ] || [ "$PUBLISH_WORKER" = "true" ]; } && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Select release tag v${version} to publish." >&2
            exit 1
          fi
          if [ "$PUBLISH_NPM" = "true" ] && [ "$PRIVATE_REPOSITORY" = "true" ]; then
            echo "npm provenance requires a public source repository." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Start with a fresh npm cache
        run: |
          npm_cache=$(mktemp -d "$RUNNER_TEMP/murm-npm-cache.XXXXXXXX")
          printf 'npm_config_cache=%s\n' "$npm_cache" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Pack the npm candidate and prepare offline package tests
        run: |
          mkdir "$RUNNER_TEMP/npm-release"
          npm pack --loglevel=error --pack-destination "$RUNNER_TEMP/npm-release"
          npm install --prefix "$RUNNER_TEMP/consumer" --prefer-offline --omit=dev --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-release"/*.tgz
      - run: npm test
      - name: Record the npm candidate checksum
        working-directory: ${{ runner.temp }}/npm-release
        run: sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: error

  publish-worker-image:
    name: Publish GHCR Worker Image
    needs: verify
    if: github.event_name == 'push' || inputs.publish_worker_image == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/luna-shi/murm-worker:${{ needs.verify.outputs.version }}
            ghcr.io/luna-shi/murm-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: Publish @luna-shi/murm to npm
    needs: verify
    if: github.event_name == 'push' || inputs.publish_npm == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish @luna-shi/murm
        working-directory: ${{ runner.temp }}/npm-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sha256sum --check SHA256SUMS
          npm publish --ignore-scripts --access public --provenance ./*.tgz
