name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish @luna-shi/murm and @luna-shi/murm-trace-viewer to npm'
        type: boolean
        default: true
      publish_worker_image:
        description: 'Build and push ghcr.io/luna-shi/murm-worker to GHCR'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify package version matches tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          viewer_version=$(node -p "require('./trace-viewer/package.json').version")
          if [ "$version" != "$viewer_version" ]; then
            echo "package.json ($version) and trace-viewer/package.json ($viewer_version) versions must match" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix trace-viewer test

  publish-worker-image:
    name: Publish GHCR Worker Image
    needs: verify
    if: github.event_name == 'push' || inputs.publish_worker_image == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/luna-shi/murm-worker:${{ needs.verify.outputs.version }}
            ghcr.io/luna-shi/murm-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: Publish npm Packages
    needs: verify
    if: github.event_name == 'push' || inputs.publish_npm == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish @luna-shi/murm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Publish @luna-shi/murm-trace-viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm --prefix trace-viewer publish --access public --provenance
