name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release version and visibility
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable package version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$version."
            exit 1
          fi
          if [[ "$PUBLISH" == true && "$PRIVATE_REPOSITORY" == true ]]; then
            echo "::error::Make the repository public before publishing an anonymous GitHub Release download."
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Start with a fresh npm cache
        run: |
          npm_cache=$(mktemp -d "$RUNNER_TEMP/murm-npm-cache.XXXXXXXX")
          printf 'npm_config_cache=%s\n' "$npm_cache" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Pack the candidate and install it outside the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/murm-release"
          archive="$package_dir/luna-shi-murm-$VERSION.tgz"
          mkdir "$package_dir"
          npm pack --loglevel=error --pack-destination "$package_dir"
          npm install --prefix "$RUNNER_TEMP/consumer" --prefer-offline --omit=dev --ignore-scripts --no-audit --no-fund "$archive"
      - run: npm test
      - name: Prepare Release asset names and checksums
        working-directory: ${{ runner.temp }}/murm-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "luna-shi-murm-$VERSION.tgz" luna-shi-murm.tgz
          sha256sum "luna-shi-murm-$VERSION.tgz" luna-shi-murm.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: murm-release
          path: ${{ runner.temp }}/murm-release
          if-no-files-found: error

  publish:
    name: Publish GitHub Release and GHCR Worker
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    concurrency:
      group: stable-release-publication
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/luna-shi/murm-worker
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: murm-release
          path: ${{ runner.temp }}/murm-release
      - name: Verify staged Release assets
        working-directory: ${{ runner.temp }}/murm-release
        run: |
          sha256sum --check SHA256SUMS
          cmp "luna-shi-murm-$VERSION.tgz" luna-shi-murm.tgz
      - name: Read existing Release status
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.tag_name, (if .draft then "draft" elif .prerelease then "prerelease" else "published" end)] | @tsv')
          status=$(printf '%s\n' "$releases" | awk -v tag="$GITHUB_REF_NAME" '$1 == tag {print $2; exit}')
          if [ "$status" = prerelease ]; then
            echo "::error::A prerelease already uses stable tag $GITHUB_REF_NAME."
            exit 1
          fi
          newest=$(printf '%s\n' "$releases" |
            awk -v tag="$GITHUB_REF_NAME" '$2 == "published" {print $1} END {print tag}' |
            awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' | sort -V | tail -n 1)
          make_latest=false
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then make_latest=true; fi
          printf 'status=%s\nmake_latest=%s\n' "${status:-missing}" "$make_latest" >> "$GITHUB_OUTPUT"
      - name: Check existing published Release assets
        if: steps.release.outputs.status == 'published'
        working-directory: ${{ runner.temp }}/murm-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --dir "$existing" \
            --pattern "luna-shi-murm-$VERSION.tgz" --pattern luna-shi-murm.tgz --pattern SHA256SUMS
          cd "$existing"
          sha256sum "luna-shi-murm-$VERSION.tgz" luna-shi-murm.tgz | cmp - SHA256SUMS
          cmp "luna-shi-murm-$VERSION.tgz" luna-shi-murm.tgz
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.release.outputs.status != 'published'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the versioned Worker image
        if: steps.release.outputs.status != 'published'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Worker (pi)
        if: steps.release.outputs.status != 'published'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-pi
          build-args: |
            WORKER_EXECUTOR=pi
          cache-from: type=gha
      - name: Build and push Worker (codex)
        if: steps.release.outputs.status != 'published'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-codex
          build-args: |
            WORKER_EXECUTOR=codex
          cache-from: type=gha
      - name: Build and push Worker (pi-1.4.0)
        if: steps.release.outputs.status != 'published'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-pi-1.4.0
          build-args: |
            WORKER_EXECUTOR=pi
            PI_VERSION=1.4.0
          cache-from: type=gha
      - name: Confirm anonymous access to the versioned Worker
        shell: bash
        run: |
          repository=${IMAGE#ghcr.io/}
          token=$(curl -fsS --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$repository:pull" \
            https://ghcr.io/token | jq -er '.token')
          for tag in "$VERSION" "$VERSION-pi" "$VERSION-codex" "$VERSION-pi-1.4.0"; do
            if ! curl -fsS --head --output /dev/null \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/$repository/manifests/$tag"; then
              echo "::error::Anonymous Worker pull failed for $tag. Verify the versioned tag and public access in GitHub Packages."
              exit 1
            fi
          done
      - name: Publish the verified tarball and latest download alias
        if: steps.release.outputs.status != 'published'
        working-directory: ${{ runner.temp }}/murm-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
          MAKE_LATEST: ${{ steps.release.outputs.make_latest }}
        run: |
          if [ "$RELEASE_STATUS" = missing ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "luna-shi-murm-$VERSION.tgz" luna-shi-murm.tgz SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$MAKE_LATEST"
      - name: Point the latest Worker tag at the latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi
